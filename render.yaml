# Staging / development Blueprint for Kaku Craft API on Render.
# Dashboard → New → Blueprint → connect Samuel-K95/Kaku-Craft-Backend
# Keep DJANGO_DEBUG=true for this environment (not production hardening).

services:
  - type: web
    name: kaku-api-staging
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /admin/login/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: RENDER
        value: "true"
      - key: DJANGO_DEBUG
        value: "true"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DJANGO_CORS_ALLOW_ALL_ORIGINS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: kaku-db-staging
          property: connectionString
      # Set these manually in the Render dashboard after create:
      # CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET
      # DJANGO_CORS_ALLOWED_ORIGINS=https://kaku-web-staging.onrender.com
      # DJANGO_CSRF_TRUSTED_ORIGINS=https://kaku-api-staging.onrender.com,https://kaku-web-staging.onrender.com

databases:
  - name: kaku-db-staging
    plan: free
    databaseName: kakucraft_staging
    user: kakucraft
